<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pumpkin Panic</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
  :root { --bg: #0d0818; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  body { display: flex; justify-content: center; align-items: center; }
  canvas { touch-action: none; max-width: 100%; }
</style>
</head>
<body>
<script>
let state = "start";
let px, py;
let score = 0;
let lives = 3;
let best = 0;
let things = [];
let stars = [];
let bats = [];
let spawnTimer = 0;
let flash = 0;

function setup() {
  createCanvas(min(windowWidth, 520), min(windowHeight, 720));
  px = width / 2;
  py = height - 80;
  for (let i = 0; i < 40; i++) {
    stars.push({ x: random(width), y: random(height * 0.7), s: random(1, 3) });
  }
  for (let i = 0; i < 4; i++) {
    bats.push({ x: random(width), y: random(40, 200), speed: random(1, 2.5) });
  }
  textFont("Georgia");
}

function windowResized() {
  resizeCanvas(min(windowWidth, 520), min(windowHeight, 720));
  py = height - 80;
}

function draw() {
  drawBackground();

  if (state === "start") {
    drawPlayer();
    titleText("PUMPKIN PANIC", "Catch the candy. Dodge the ghosts!\nMove: mouse, touch, or ← →\n\nTap or press SPACE to start");
  } else if (state === "play") {
    playGame();
  } else {
    drawPlayer();
    titleText("YOU GOT HAUNTED", "Score: " + score + "   Best: " + best + "\n\nTap or press SPACE to try again");
  }

  if (flash > 0) {
    noStroke();
    fill(255, 0, 0, flash);
    rect(0, 0, width, height);
    flash -= 10;
  }
}

function playGame() {
  if (keyIsDown(LEFT_ARROW) || keyIsDown(65)) px -= 7;
  if (keyIsDown(RIGHT_ARROW) || keyIsDown(68)) px += 7;
  if (mouseIsPressed || movedMouse()) px = lerp(px, mouseX, 0.25);
  px = constrain(px, 30, width - 30);

  spawnTimer--;
  if (spawnTimer <= 0) {
    let isGhost = random() < 0.35;
    things.push({
      x: random(30, width - 30),
      y: -30,
      ghost: isGhost,
      speed: random(2, 4) + score * 0.03,
      wobble: random(TWO_PI)
    });
    spawnTimer = max(15, 40 - score * 0.5);
  }

  for (let i = things.length - 1; i >= 0; i--) {
    let t = things[i];
    t.y += t.speed;
    if (t.ghost) t.x += sin(frameCount * 0.08 + t.wobble) * 2;

    if (t.ghost) drawGhost(t.x, t.y);
    else drawCandy(t.x, t.y);

    if (dist(t.x, t.y, px, py) < 40) {
      if (t.ghost) {
        lives--;
        flash = 120;
        if (lives <= 0) {
          state = "over";
          best = max(best, score);
        }
      } else {
        score++;
      }
      things.splice(i, 1);
    } else if (t.y > height + 40) {
      things.splice(i, 1);
    }
  }

  drawPlayer();
  drawHUD();
}

let lastMouseX = 0;
function movedMouse() {
  let moved = mouseX !== lastMouseX;
  lastMouseX = mouseX;
  return moved;
}

function drawBackground() {
  background(13, 8, 24);
  noStroke();
  for (let s of stars) {
    fill(255, 255, 255, 120 + 100 * sin(frameCount * 0.05 + s.x));
    circle(s.x, s.y, s.s);
  }
  fill(255, 240, 180);
  circle(width - 80, 90, 80);
  fill(13, 8, 24);
  circle(width - 60, 80, 70);
  for (let b of bats) {
    b.x += b.speed;
    if (b.x > width + 30) b.x = -30;
    let flap = sin(frameCount * 0.3) * 8;
    fill(0);
    triangle(b.x, b.y, b.x - 18, b.y - flap, b.x - 8, b.y + 4);
    triangle(b.x, b.y, b.x + 18, b.y - flap, b.x + 8, b.y + 4);
    circle(b.x, b.y, 8);
  }
  fill(25, 15, 35);
  rect(0, height - 40, width, 40);
  for (let x = 40; x < width; x += 130) {
    fill(70, 65, 85);
    rect(x, height - 70, 24, 32, 12, 12, 0, 0);
    fill(40, 35, 55);
    rect(x + 11, height - 62, 2, 10);
    rect(x + 7, height - 58, 10, 2);
  }
}

function drawPlayer() {
  noStroke();
  fill(255, 120, 0);
  ellipse(px - 12, py, 36, 44);
  ellipse(px + 12, py, 36, 44);
  fill(240, 100, 0);
  ellipse(px, py, 36, 46);
  fill(60, 130, 40);
  rect(px - 3, py - 28, 7, 10);
  fill(30, 10, 0);
  triangle(px - 14, py - 8, px - 6, py - 8, px - 10, py - 15);
  triangle(px + 14, py - 8, px + 6, py - 8, px + 10, py - 15);
  arc(px, py + 6, 30, 20, 0, PI);
  fill(255, 220, 80);
  triangle(px - 3, py + 8, px + 3, py + 8, px, py + 13);
}

function drawGhost(x, y) {
  noStroke();
  fill(255, 255, 255, 40);
  circle(x, y, 60);
  fill(235, 240, 255);
  circle(x, y - 6, 34);
  rect(x - 17, y - 6, 34, 26);
  for (let i = 0; i < 3; i++) circle(x - 11 + i * 11, y + 20, 11);
  fill(20);
  circle(x - 6, y - 8, 6);
  circle(x + 6, y - 8, 6);
  ellipse(x, y + 3, 6, 9);
}

function drawCandy(x, y) {
  push();
  translate(x, y);
  rotate(frameCount * 0.05);
  noStroke();
  fill(255, 80, 180);
  triangle(-8, 0, -20, -9, -20, 9);
  triangle(8, 0, 20, -9, 20, 9);
  fill(150, 60, 255);
  circle(0, 0, 18);
  fill(255, 255, 255, 140);
  arc(0, 0, 12, 12, PI, TWO_PI);
  pop();
}

function drawHUD() {
  noStroke();
  fill(255, 160, 40);
  textAlign(LEFT, TOP);
  textSize(24);
  text("Candy: " + score, 14, 12);
  textAlign(RIGHT, TOP);
  text("♥ ".repeat(max(lives, 0)).trim(), width - 14, 12);
}

function titleText(big, small) {
  fill(0, 0, 0, 150);
  rect(0, height * 0.22, width, height * 0.36);
  textAlign(CENTER, CENTER);
  fill(255, 120, 0);
  textSize(min(48, width * 0.1));
  text(big, width / 2, height * 0.3);
  fill(230, 225, 245);
  textSize(18);
  text(small, width / 2, height * 0.45);
}

function startGame() {
  score = 0;
  lives = 3;
  things = [];
  spawnTimer = 30;
  state = "play";
}

function keyPressed() {
  if (key === " " && state !== "play") startGame();
  if (key === " ") return false;
}

function mousePressed() {
  if (state !== "play") startGame();
}
</script>
</body>
</html>
